[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pyfortiflex"
dynamic = ["version"]
description = "Python client for the FortiFlex v2 API, with safe per-node entitlement allocation"
readme = "README.md"
authors = [{ name = "Dylan Spille" }]
license = { text = "MIT" }
keywords = ["fortinet", "fortiflex", "licensing", "api"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
typecheck = ["mypy>=1.13", "types-requests"]
# Pinned so a local run and CI agree; bump deliberately.
lint = ["ruff==0.17.3"]

[project.urls]
Homepage = "https://github.com/ftnt-dspille/pyfortiflex"
Repository = "https://github.com/ftnt-dspille/pyfortiflex.git"
Issues = "https://github.com/ftnt-dspille/pyfortiflex/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.hatch.build.targets.wheel]
packages = ["src/pyfortiflex"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
